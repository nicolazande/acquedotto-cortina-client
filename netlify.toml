# Configurazione della build come codice: prima dipendeva solo dalle impostazioni
# scritte nel pannello Netlify, quindi non era verificabile ne ripristinabile.

[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 6 supporta Node 18, 20 e 22 ma NON 19 e 21: senza questo vincolo un
  # cambio del valore predefinito di Netlify farebbe fallire la build.
  NODE_VERSION = "24"

# Le rotte dell'applicazione sono gestite dal client: qualunque percorso deve
# restituire index.html. Duplica public/_redirects, che resta come riserva.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# L'HTML non va mai riusato dalla cache: contiene i riferimenti ai file della build
# corrente, che cambiano nome a ogni pubblicazione. Una copia vecchia punterebbe a
# file non piu esistenti e la pagina resterebbe bianca.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# I file con l'impronta nel nome sono immutabili e si possono tenere per sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
