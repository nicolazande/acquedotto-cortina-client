name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # La build e il controllo piu utile del client: fallisce su qualunque
      # errore di sintassi o import non risolto.
      - name: Build di produzione
        run: npm run build

      - name: Controlli veloci
        run: npm run test:smoke
